<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monify</title>
  <link rel="icon" href="/assets/logo.svg" type="image/svg+xml">
  <link rel="shortcut icon" href="/assets/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/styles.css?v=6">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>
  <main class="view-container" id="player-view">
    <header class="top-bar">
      <div class="brand-mark">
        <img src="/assets/logo.svg" alt="Monify logo" class="brand-logo">
        <div>
          <p class="eyebrow">Music Player</p>
          <h1>Monify</h1>
        </div>
      </div>
      <button class="search-trigger" id="search-trigger" type="button">
        <i data-lucide="search"></i>
        <span>Search</span>
      </button>
    </header>

    <section class="player-card">
      <div class="quality-anchor" style="display: flex; gap: 12px; align-items: center;">
        <button class="btn-icon menu-trigger" id="downloads-trigger" title="Local Downloads" type="button">
          <i data-lucide="folder-down"></i>
        </button>
        <button class="btn-icon menu-trigger" id="quality-menu-btn" title="Quality settings" type="button">
          <i data-lucide="more-horizontal"></i>
        </button>
        <div id="quality-menu" class="quality-menu hidden">
          <div id="main-quality-options" style="display:flex; flex-direction:column; gap:16px;">
            <button class="menu-item-btn" id="open-resolutions-btn" type="button" style="background:transparent; border:none; color:var(--text-main); font-size:1rem; cursor:pointer; display:flex; align-items:center; gap:12px; width:100%; text-align:left;">
              <i data-lucide="music" style="width: 18px; height: 18px;"></i> Quality
            </button>
            <button class="menu-item-btn" id="open-config-btn" type="button" style="background:transparent; border:none; color:var(--text-main); font-size:1rem; cursor:pointer; display:flex; align-items:center; gap:12px; width:100%; text-align:left;">
              <i data-lucide="settings" style="width: 18px; height: 18px;"></i> Config
            </button>
            <button class="menu-item-btn" id="clear-cache-btn" type="button" style="background:transparent; border:none; color:#ff4d4d; font-size:1rem; cursor:pointer; display:flex; align-items:center; gap:12px; width:100%; text-align:left;">
              <i data-lucide="trash-2" style="width: 18px; height: 18px;"></i> Clear Caches
            </button>
          </div>
          <div id="resolutions-submenu" class="hidden">
            <button class="menu-item-btn" id="back-to-main-btn" type="button" style="background:transparent; border:none; color:var(--text-muted); font-size:0.9rem; cursor:pointer; margin-bottom:12px; display:flex; align-items:center; gap:4px; margin-top:-4px;">
              <i data-lucide="arrow-left" style="width: 16px; height: 16px;"></i> Back
            </button>
            <p class="menu-title">Audio Quality</p>
            <div id="custom-quality-select" style="display:flex; flex-direction:column; gap:8px;">
              <button type="button" class="qc-btn" data-val="320k">320k Ultra</button>
              <button type="button" class="qc-btn" data-val="256k">256k High</button>
              <button type="button" class="qc-btn" data-val="192k">192k Balanced</button>
              <button type="button" class="qc-btn active" data-val="128k">128k Standard</button>
              <button type="button" class="qc-btn" data-val="96k">96k Data Saver</button>
              <button type="button" class="qc-btn" data-val="64k">64k Low</button>
            </div>
          </div>
        </div>
      </div>

      <div class="disc-stage">
        <div class="vinyl-disc" id="vinyl-disc">
          <img class="disk-base" src="/assets/disk.svg" alt="Disk">
          <div class="disc-art">
            <img id="disc-thumbnail" src="" alt="Song thumbnail">
          </div>
        </div>
      </div>

      <div class="player-info">
        <div class="title-row">
          <div class="text-info">
            <p class="eyebrow">Now playing</p>
            <h2 id="selected-title">Monify</h2>
            <p class="song-meta" id="selected-artist"></p>
          </div>
        </div>

        <div class="progress-panel">
          <input type="range" id="progress-slider" class="progress-slider" min="0" max="100" value="0" step="0.1"
            aria-label="Seek song">
          <div class="time-info">
            <span id="current-time">0:00</span>
            <span id="total-time">0:00</span>
          </div>
        </div>

        <div class="playback-controls">
          <button class="btn-inline" id="download-btn" title="Download" type="button">
            <i data-lucide="download"></i>
          </button>
          <button class="btn-control" id="prev-btn" type="button" aria-label="Previous song">
            <i data-lucide="skip-back"></i>
          </button>
          <button class="btn-play" id="play-btn" type="button" aria-label="Play or pause">
            <span id="play-glyph"><i data-lucide="play"></i></span>
            <span class="loading hidden" id="loading-indicator" aria-hidden="true"></span>
          </button>
          <button class="btn-control" id="next-btn" type="button" aria-label="Next song">
            <i data-lucide="skip-forward"></i>
          </button>
          <button class="btn-inline" id="recent-btn" title="Recently Played" type="button">
            <i data-lucide="history"></i>
          </button>
        </div>

        <p class="status" id="player-status"></p>


      </div>
    </section>
  </main>

  <main class="view-container hidden" id="search-view">
    <section class="search-card">
      <header class="search-header">
        <form id="search-form" class="search-form">
          <div class="search-input-wrap">
            <button type="button" class="btn-icon" id="back-btn" aria-label="Back to player">
              <i data-lucide="arrow-left"></i>
            </button>
            <input id="search-input" type="text" placeholder="Search songs, moods, artists" autocomplete="off">
            <button type="submit" class="search-submit">Search</button>
          </div>
        </form>
      </header>

      <div class="results-meta">
        <span class="eyebrow" id="results-label">Results</span>
        <span class="count" id="search-count"></span>
      </div>

      <div class="results-container" id="results"></div>
    </section>
  </main>

  <main class="view-container hidden" id="downloads-view">
    <section class="search-card">
      <header class="search-header">
        <div class="search-form">
          <div class="search-input-wrap">
            <button type="button" class="btn-icon" id="downloads-back-btn" aria-label="Back to player">
              <i data-lucide="arrow-left"></i>
            </button>
            <input id="downloads-search-input" type="text" placeholder="Search downloaded songs" autocomplete="off">
          </div>
        </div>
      </header>

      <div class="results-meta">
        <span class="eyebrow" id="downloads-results-label">Local Downloads</span>
        <span class="count" id="downloads-count"></span>
      </div>

      <div class="results-container" id="downloads-results"></div>
      
      <div class="pagination-controls hidden" id="downloads-pagination">
        <button class="downloads-trigger" id="downloads-prev-page" disabled>
          <i data-lucide="chevron-left"></i> Back
        </button>
        <span id="downloads-page-info" class="page-info">Page 1</span>
        <button class="downloads-trigger" id="downloads-next-page" disabled>
          Next <i data-lucide="chevron-right"></i>
        </button>
      </div>
    </section>
  </main>

  <div id="settings-modal" class="modal hidden" style="position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:1000; display:flex; padding:20px; justify-content:center; align-items:flex-start; overflow-y:auto;">
    <div style="background:var(--bg-card); padding:24px; border-radius:12px; width:100%; max-width:400px; margin-top:10vh;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
        <h2 style="margin:0; font-size:1.2rem;">Configuration</h2>
        <button id="close-settings-btn" style="background:none; border:none; color:white; cursor:pointer;"><i data-lucide="x"></i></button>
      </div>

      <div style="display:flex; flex-direction:column; gap:16px;">
        <div>
          <label style="display:flex; justify-content:space-between; font-size:0.9rem; margin-bottom:6px; color:var(--text-muted);">Ignore videos shorter than (sec)
             <button id="reset-min-duration" style="background:none; border:none; color:var(--primary); font-size:0.8rem; cursor:pointer;">Reset</button>
          </label>
          <input id="config-min-duration" type="number" style="width:100%; padding:10px; border-radius:8px; border:1px solid rgba(255,255,255,0.1); background:var(--bg-main); color:white; font-family:inherit;">
        </div>
        
        <div>
          <label style="display:flex; justify-content:space-between; font-size:0.9rem; margin-bottom:6px; color:var(--text-muted);">Trending Search Query
             <button id="reset-trending-query" style="background:none; border:none; color:var(--primary); font-size:0.8rem; cursor:pointer;">Reset</button>
          </label>
          <input id="config-trending-query" type="text" style="width:100%; padding:10px; border-radius:8px; border:1px solid rgba(255,255,255,0.1); background:var(--bg-main); color:white; font-family:inherit;">
        </div>

        <div>
          <label style="display:flex; justify-content:space-between; font-size:0.9rem; margin-bottom:6px; color:var(--text-muted);">Trending Limit
             <button id="reset-trending-limit" style="background:none; border:none; color:var(--primary); font-size:0.8rem; cursor:pointer;">Reset</button>
          </label>
          <input id="config-trending-limit" type="number" style="width:100%; padding:10px; border-radius:8px; border:1px solid rgba(255,255,255,0.1); background:var(--bg-main); color:white; font-family:inherit;">
        </div>

        <div>
          <label style="display:flex; justify-content:space-between; font-size:0.9rem; margin-bottom:6px; color:var(--text-muted);">Default Song (YouTube URL)
             <button id="reset-default-song" style="background:none; border:none; color:var(--primary); font-size:0.8rem; cursor:pointer;">Reset</button>
          </label>
          <input id="config-default-url" type="text" placeholder="https://youtube.com/watch?v=..." style="width:100%; padding:10px; border-radius:8px; border:1px solid rgba(255,255,255,0.1); background:var(--bg-main); color:white; font-family:inherit;">
        </div>

        <div>
          <label style="display:flex; justify-content:space-between; font-size:0.9rem; margin-bottom:6px; color:var(--text-muted);">YouTube API Key
             <button id="reset-api-key" style="background:none; border:none; color:var(--primary); font-size:0.8rem; cursor:pointer;">Reset</button>
          </label>
          <input id="config-api-key" type="password" placeholder="Enter your YouTube API key" style="width:100%; padding:10px; border-radius:8px; border:1px solid rgba(255,255,255,0.1); background:var(--bg-main); color:white; font-family:inherit;">
        </div>

        <button id="save-settings-btn" style="background:var(--primary); color:black; border:none; padding:12px; border-radius:8px; font-weight:600; font-size:1rem; cursor:pointer; margin-top:8px;">Apply Settings</button>
      </div>
    </div>
  </div>

  <div id="toast-top-container" style="position:fixed; top:16px; left:50%; transform:translateX(-50%); z-index:9999; display:flex; flex-direction:column; gap:8px; align-items:center;"></div>
  <div id="toast-container" style="position:fixed; bottom:20px; left:50%; transform:translateX(-50%); z-index:9999; display:flex; flex-direction:column; gap:10px; align-items:center;"></div>

  <audio id="audio-player"></audio>
  <input type="hidden" id="url-input">
  <script src="/assets/config.js?v=6"></script>
  <script src="/assets/app.js?v=6"></script>
</body>

</html>
